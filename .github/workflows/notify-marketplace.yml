name: Notify marketplace of plugin updates

on:
  push:
    branches: [main]

jobs:
  detect-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed plugins
        id: changed
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          else
            BASE="${{ github.event.before }}"
          fi
          PLUGINS=$(git diff --name-only "$BASE" "${{ github.sha }}" -- plugins/ \
            | awk -F/ '{print $2}' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"

      - name: Dispatch to marketplace repo
        if: steps.changed.outputs.plugins != '[]'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/georgejinu-labs/claude-marketplace/dispatches \
            -d @- <<EOF
          {
            "event_type": "plugin-updated",
            "client_payload": {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "main",
              "plugins": ${{ steps.changed.outputs.plugins }}
            }
          }
          EOF
